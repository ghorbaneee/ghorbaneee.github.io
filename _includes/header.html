<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap site-header__row">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand__name">{{ site.author.short_name }}</span>
    </a>

    <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="site-nav">
      <span class="nav-toggle__icon">{% include icon.html name="menu" %}</span>
      <span class="visually-hidden">Menu</span>
    </button>

    <nav class="site-nav" id="site-nav">
      <ul>
        {% for item in site.nav %}
        <li>
          <a href="{{ item.url | relative_url }}"
             {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.title }}</a>
        </li>
        {% endfor %}
      </ul>
    </nav>
  </div>

  {% if page.layout == "home" %}
  <div class="wrap sub-nav-wrap">
    <nav class="sub-nav" aria-label="Sections on this page">
      {% for a in site.home_anchors %}
      <a href="{{ a.url }}">{{ a.title }}</a>
      {% endfor %}
    </nav>
  </div>
  {% endif %}
</header>
