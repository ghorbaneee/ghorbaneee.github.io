- title: "CFD Framework for Frost-Free Domestic Refrigerators"
  years: "2020 – 2022"
  tools: "ANSYS Fluent · Rotating-frame fan model · Experimental validation"
  detail: >-
    Built and validated a CFD framework predicting airflow and temperature
    distribution in a domestic refrigerator, modeling fan–evaporator
    interactions with a rotating-frame fan and radiator-based evaporator.
    Validated against experiment to within 0.2–1.1°C and <7% flow rate.
