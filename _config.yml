# ---------------------------------------------------------------------------
# Site configuration
# Edit the values below to update global site info. Rebuild is automatic
# on GitHub Pages after every push to the main branch.
# ---------------------------------------------------------------------------

title: "Amirhossein Ghorbani"
tagline: "PhD Researcher in Combustion & Sustainable Aviation Fuels"
description: >-
  Personal academic website of Amirhossein Ghorbani, PhD student in Mechanical
  Engineering at the University of British Columbia, researching flame physics,
  optical diagnostics, and sustainable aviation fuels.
url: "https://ghorbaneee.github.io"
baseurl: ""

# Author / person info (used across pages, SEO, and JSON-LD structured data)
author:
  name: "Amirhossein Ghorbani"
  short_name: "Amir Ghorbani"
  role: "PhD Student, Mechanical Engineering"
  institution: "University of British Columbia"
  department: "School of Engineering — Combustion for Propulsion and Power Laboratory"
  location: "Kelowna, British Columbia, Canada"
  email: "Amir.Ghorbani@ubc.ca"
  photo: "/assets/img/profile.jpg"
  photo_square: "/assets/img/profile-square.jpg"
  supervisor: "Dr. Sina Kheirkhah"

# Social / profile links (leave blank to hide an icon)
social:
  email: "mailto:Amir.Ghorbani@ubc.ca"
  github: "https://github.com/ghorbaneee"
  linkedin: "https://www.linkedin.com/in/amirhosein-ghorbani/"
  scholar: "https://scholar.google.ca/citations?user=UOdlSE0AAAAJ&hl=en"
  orcid: ""

nav:
  - title: "Home"
    url: "/"
  - title: "Publications"
    url: "/publications/"
  - title: "Teaching"
    url: "/teaching/"
  - title: "CV"
    url: "/cv/"
  - title: "Contact"
    url: "/contact/"

# In-page anchor links shown on the Home page sub-nav
home_anchors:
  - title: "About"
    url: "#about"
  - title: "Research"
    url: "#research"
  - title: "Projects"
    url: "#projects"
  - title: "News"
    url: "#news"
  - title: "Awards"
    url: "#awards"

# ---------------------------------------------------------------------------
# Build settings
# ---------------------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
permalink: pretty

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
  - .sass-cache

sass:
  style: compressed

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
